spring.application.name=acts
server.port=8080

# ─── MySQL (JPA) ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/felicity_smoak?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ─── MongoDB ──────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=mongodb://localhost:27017/acts_intelligence
spring.data.mongodb.auto-index-creation=true

# ─── Sistema ACTS ─────────────────────────────────────────────────────────────
acts.system.name=Arrow Command & Tactical System
acts.system.version=1.0.0
